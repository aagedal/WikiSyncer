[package]
name = "wikisync-integrity"
description = "Content hashing, manifests, signatures, and verification for WikiSyncer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
ring = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wikisync-content = { version = "=0.1.0", path = "../wikisync-content" }
wikisync-store = { version = "=0.1.0", path = "../wikisync-store" }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3.20"
wikisync-core = { version = "=0.1.0", path = "../wikisync-core" }
