[package]
name = "wikisync-store"
description = "Transactional metadata and content-object storage for WikiSyncer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8"
rusqlite = { version = "0.37", features = ["bundled"] }
rustix = { version = "1.1", features = ["fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
wikisync-content = { version = "=0.1.0", path = "../wikisync-content" }
wikisync-core = { version = "=0.1.0", path = "../wikisync-core" }
zstd = "0.13"
