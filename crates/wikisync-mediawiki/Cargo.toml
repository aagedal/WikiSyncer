[package]
name = "wikisync-mediawiki"
description = "Bounded MediaWiki source adapters for WikiSyncer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
fuzzing = []

[dependencies]
blake3 = "1.8"
bzip2 = { version = "0.6", default-features = false, features = ["bzip2-sys"] }
bytes = "1.10"
fs2 = "0.4"
libc = "0.2"
quick-xml = "0.41"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["net", "sync", "time"] }
wikisync-core = { version = "=0.1.0", path = "../wikisync-core" }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
