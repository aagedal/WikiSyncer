[package]
name = "wikisync-web"
description = "Read-only local web reader for WikiSyncer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8"
percent-encoding = "2.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.0", features = ["net"] }
wikisync-content = { version = "=0.1.0", path = "../wikisync-content" }
wikisync-core = { version = "=0.1.0", path = "../wikisync-core" }
wikisync-search = { version = "=0.1.0", path = "../wikisync-search" }
wikisync-store = { version = "=0.1.0", path = "../wikisync-store" }

[dev-dependencies]
tempfile = "3.20"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
