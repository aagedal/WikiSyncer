[package]
name = "wikisync-sync"
description = "Synchronization planning and job execution for WikiSyncer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
sha1 = "0.10"
url = "2.5"
wikisync-content = { version = "=0.1.0", path = "../wikisync-content" }
wikisync-core = { version = "=0.1.0", path = "../wikisync-core" }
wikisync-mediawiki = { version = "=0.1.0", path = "../wikisync-mediawiki" }
wikisync-search = { version = "=0.1.0", path = "../wikisync-search" }
wikisync-store = { version = "=0.1.0", path = "../wikisync-store" }

[dev-dependencies]
blake3 = "1.8"
bzip2 = { version = "0.6", default-features = false, features = ["bzip2-sys"] }
tempfile = "3.20"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
