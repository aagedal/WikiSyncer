[package]
name = "wikisyncd"
description = "Background scheduler and single-writer service for WikiSyncer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wikisyncd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
fs2 = "0.4"
nix = { version = "0.30", default-features = false, features = ["socket", "user"] }
signal-hook = "0.3"
tokio = { version = "1.0", features = ["net", "rt", "time"] }
wikisync-core = { version = "=0.1.0", path = "../../crates/wikisync-core" }
wikisync-integrity = { version = "=0.1.0", path = "../../crates/wikisync-integrity" }
wikisync-mediawiki = { version = "=0.1.0", path = "../../crates/wikisync-mediawiki" }
wikisync-store = { version = "=0.1.0", path = "../../crates/wikisync-store" }
wikisync-sync = { version = "=0.1.0", path = "../../crates/wikisync-sync" }

[dev-dependencies]
blake3 = "1.8"
bzip2 = { version = "0.6", default-features = false, features = ["bzip2-sys"] }
