[package]
name = "wikisyncd"
description = "Background scheduler and single-writer service for WikiSyncer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wikisyncd"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tokio = { version = "1.0", features = ["net", "rt", "time"] }
wikisync-core = { path = "../../crates/wikisync-core" }
wikisync-integrity = { path = "../../crates/wikisync-integrity" }
wikisync-mediawiki = { path = "../../crates/wikisync-mediawiki" }
wikisync-store = { path = "../../crates/wikisync-store" }
wikisync-sync = { path = "../../crates/wikisync-sync" }
