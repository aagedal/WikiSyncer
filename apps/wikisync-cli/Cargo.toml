[package]
name = "wikisync-cli"
description = "Command-line interface for WikiSyncer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wikisync"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
serde_json = "1.0"
tokio = { version = "1.0", features = ["net", "rt"] }
wikisync-content = { path = "../../crates/wikisync-content" }
wikisync-core = { path = "../../crates/wikisync-core" }
wikisync-search = { path = "../../crates/wikisync-search" }
wikisync-store = { path = "../../crates/wikisync-store" }
wikisync-web = { path = "../../crates/wikisync-web" }

[dev-dependencies]
axum = "0.8"
tempfile = "3.20"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
wikisync-mediawiki = { path = "../../crates/wikisync-mediawiki" }
wikisync-sync = { path = "../../crates/wikisync-sync" }
