[package]
name = "wikisync-gui"
description = "Iced desktop interface for WikiSyncer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "tokio"] }
wikisync-core = { version = "=0.1.0", path = "../../crates/wikisync-core" }
wikisync-integrity = { version = "=0.1.0", path = "../../crates/wikisync-integrity" }
wikisync-mediawiki = { version = "=0.1.0", path = "../../crates/wikisync-mediawiki" }
wikisync-store = { version = "=0.1.0", path = "../../crates/wikisync-store" }
wikisync-sync = { version = "=0.1.0", path = "../../crates/wikisync-sync" }
wikisync-web = { version = "=0.1.0", path = "../../crates/wikisync-web" }
wikisyncd = { version = "=0.1.0", path = "../wikisyncd" }

[dev-dependencies]
tempfile = "3.20"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
