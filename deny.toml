[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Used by Iced's Windows-only clipboard dependencies. BSL-1.0 is
    # permissive; Windows is not a release target, but cargo-deny audits the
    # complete locked dependency graph.
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # Mozilla/CCADB root-certificate data used by reqwest's Rustls backend.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
