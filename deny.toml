[advisories]
yanked = "deny"
ignore = [
    # Iced 0.13 pulls `instant` through its wasm-only timer support. The advisory
    # reports unmaintained status and offers no safe compatible upgrade.
    "RUSTSEC-2024-0384",
    # Iced 0.13's text stack currently pins rustybuzz/cosmic-text versions that
    # transitively use the unmaintained ttf-parser line. Neither advisory reports
    # a vulnerability or offers a safe upgrade within the current Iced release.
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0206",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Used by Iced's Windows-only clipboard dependencies. BSL-1.0 is
    # permissive; Windows is not a release target, but cargo-deny audits the
    # complete locked dependency graph.
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-only",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # Mozilla/CCADB root-certificate data used by reqwest's Rustls backend.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
