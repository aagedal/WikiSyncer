name: Release candidate dry run

on:
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "apps/**"
      - "crates/**"
      - "packaging/**"
      - "scripts/**"
      - "docs/operations/**"
      - "docs/security/linux-package-repository-trust.md"
      - "docs/security/macos-signing-notarization.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  archive-dry-run:
    name: ${{ matrix.target_os }} native archive
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target_os: macos
          - runner: ubuntu-24.04
            target_os: linux
    runs-on: ${{ matrix.runner }}
    steps:
      # actions/checkout v4.2.2, pinned because release jobs must not follow mutable tags.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain stable channel snapshot, resolved 2026-08-25.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy,rustfmt
      - name: Begin native evidence record
        run: echo "RELEASE_EVIDENCE_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint all targets
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Test packaging and detached-signature tooling
        run: python3 -m unittest discover -s packaging/tests -v
      - name: Build release binaries
        run: cargo build --workspace --bins --release --locked
      - name: Audit default offline behavior for outbound networking
        run: |
          set -o pipefail
          mkdir -p target/release-candidate
          python3 scripts/release_offline_audit.py --skip-build \
            | tee target/release-candidate/offline-audit.log
      - name: Build and verify deterministic release candidate
        env:
          TARGET_OS: ${{ matrix.target_os }}
        run: |
          set -eu
          version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          case "$(uname -m)" in
            arm64|aarch64) target_arch=aarch64 ;;
            x86_64|amd64) target_arch=x86_64 ;;
            *) echo "unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          if [ "$TARGET_OS" = linux ]; then
            python3 packaging/scripts/release.py verify-linux-binaries \
              --input-dir target/release \
              --target-arch "$target_arch"
            python3 packaging/scripts/release.py verify-systemd-units
          fi
          if [ "$TARGET_OS" = macos ]; then
            python3 packaging/scripts/release.py macos-signing-plan \
              --input-dir target/release \
              --output-file target/release-candidate/macos-signing-plan.json \
              --version "$version" \
              --target-arch "$target_arch" \
              --signing-identity \
                "Developer ID Application: UNPROVISIONED WIKISYNC RELEASE (AAAAAAAAAA)" \
              --team-id AAAAAAAAAA \
              --certificate-sha1 0000000000000000000000000000000000000000 \
              --source-date-epoch "$source_date_epoch" \
              --credential-free-dry-run
          fi
          python3 packaging/scripts/release.py package \
            --input-dir target/release \
            --output-dir target/release-candidate \
            --version "$version" \
            --target-os "$TARGET_OS" \
            --target-arch "$target_arch" \
            --source-date-epoch "$source_date_epoch"
          python3 packaging/scripts/release.py checksums --output-dir target/release-candidate
          python3 packaging/scripts/release.py verify-checksums \
            --checksum-file target/release-candidate/SHA256SUMS
          archive="target/release-candidate/wikisync-${version}-${TARGET_OS}-${target_arch}.tar.gz"
          python3 packaging/scripts/release.py verify-archive --archive "$archive"
          test ! -e target/release-candidate/SHA256SUMS.sig
          archive_sha256="$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$archive")"
          grep -F -- "$archive_sha256  $(basename "$archive")" target/release-candidate/SHA256SUMS
          echo "RELEASE_CANDIDATE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "RELEASE_CANDIDATE_SHA256=$archive_sha256" >> "$GITHUB_ENV"
          python3 packaging/scripts/assess_install.py \
            --archive "$archive" \
            --output target/release-candidate/install-assessment.json
      - name: Record successful native evidence
        env:
          TARGET_OS: ${{ matrix.target_os }}
        run: |
          set -eu
          test -z "$(git status --porcelain --untracked-files=all)"
          test -f "$RELEASE_CANDIDATE_ARCHIVE"
          observed_candidate_sha256="$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$RELEASE_CANDIDATE_ARCHIVE")"
          test "$observed_candidate_sha256" = "$RELEASE_CANDIDATE_SHA256"
          evidence=target/release-candidate/native-evidence.md
          lock_sha256="$(python3 -c 'import hashlib; print(hashlib.sha256(open("Cargo.lock", "rb").read()).hexdigest())')"
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "## WikiSyncer native release evidence"
            echo
            echo "- Result: PASS (all preceding steps in this job completed)"
            echo "- Candidate commit: \`$GITHUB_SHA\` (clean checkout after validation)"
            echo "- Candidate archive: \`$(basename "$RELEASE_CANDIDATE_ARCHIVE")\`"
            echo "- Candidate archive SHA-256: \`$RELEASE_CANDIDATE_SHA256\`"
            echo "- Target: \`$TARGET_OS/$(uname -m)\` on \`${{ matrix.runner }}\`"
            echo "- Started: \`$RELEASE_EVIDENCE_STARTED_AT\`"
            echo "- Finished: \`$finished_at\`"
            echo "- Cargo.lock SHA-256: \`$lock_sha256\`"
            echo "- Immutable run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
            echo
            echo '```text'
            uname -a
            if [ "$TARGET_OS" = linux ]; then
              grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
              systemd-analyze --version | head -1
            else
              sw_vers
            fi
            rustc -Vv
            cargo -V
            echo '```'
            echo
            echo "Validated commands: formatting, warning-denied Clippy, locked workspace tests, packaging tests, locked release build, default-path offline audit, deterministic packaging, checksum verification, archive-layout verification, and rootless native install rehearsal."
            if [ "$TARGET_OS" = linux ]; then
              echo "Linux-specific gates: native 64-bit ELF architecture validation and rendered systemd user-unit validation."
            fi
            echo
            echo '```text'
            cat target/release-candidate/offline-audit.log
            cat target/release-candidate/install-assessment.json
            cat target/release-candidate/SHA256SUMS
            echo '```'
          } > "$evidence"
          grep -F -- "- Candidate commit: \`$GITHUB_SHA\`" "$evidence"
          grep -F -- "- Candidate archive: \`$(basename "$RELEASE_CANDIDATE_ARCHIVE")\`" "$evidence"
          grep -F -- "- Candidate archive SHA-256: \`$RELEASE_CANDIDATE_SHA256\`" "$evidence"
          cat "$evidence"
          cat "$evidence" >> "$GITHUB_STEP_SUMMARY"
      # actions/upload-artifact v4.6.2. This retains the exact credential-free candidate
      # beside its native evidence; it does not publish a GitHub Release or sign anything.
      - name: Preserve candidate-bound native evidence
        id: preserve-native-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wikisync-${{ matrix.target_os }}-native-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: target/release-candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
          include-hidden-files: false
      - name: Record preserved evidence digest
        env:
          EVIDENCE_ARTIFACT_DIGEST: ${{ steps.preserve-native-evidence.outputs.artifact-digest }}
        run: |
          set -eu
          test -n "$EVIDENCE_ARTIFACT_DIGEST"
          echo "Preserved credential-free CI evidence artifact SHA-256: \`$EVIDENCE_ARTIFACT_DIGEST\`" \
            >> "$GITHUB_STEP_SUMMARY"

# This workflow deliberately performs no publication, platform signing, notarization,
# Gatekeeper assessment, or secret-backed checksum signing. The macOS plan contains an
# all-zero certificate fingerprint and an explicitly unprovisioned identity. Real
# release gates require explicit identities and protected credentials, and the
# resulting artifacts need separate native review. The retained Actions artifact and
# final job summary are a native, candidate-bound credential-free record; neither is
# production signing, graphical
# Linux GUI evidence on a headless runner, or a clean-system install/upgrade result.
